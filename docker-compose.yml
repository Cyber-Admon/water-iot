services:
  db:
    image: postgres:16-alpine
    container_name: water_monitor_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: water_user
      POSTGRES_PASSWORD: water_pass
      POSTGRES_DB: water_monitor
    ports:
      - "5432:5432"
    volumes:
      - water_monitor_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U water_user -d water_monitor"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: water_monitor_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://water_user:water_pass@db:5432/water_monitor
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  water_monitor_data:
